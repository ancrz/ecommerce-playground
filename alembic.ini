# Alembic Configuration for farmalux-ecommerce
# A generic, single database configuration.

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# SQLite URL (local development)
# Format: sqlite:///./data/database/main.db
# This will be overridden by env.py using environment variables
sqlalchemy.url = sqlite:///./data/database/main.db

# Prepend sys.path
prepend_sys_path = .

# Timezone for revision file timestamps
# timezone = utc

# Truncate revision hashes in filenames
# truncate_slug_length = 40

# Revision environment
revision_environment = false

# Which sourceless files to allow
# sourceless = false

# Version path separator
version_path_separator = os  # Use os.pathsep

# Output encoding
output_encoding = utf-8

[post_write_hooks]
# Run ruff after generating migrations
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = --fix REVISION_SCRIPT_FILENAME

# Logging Configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

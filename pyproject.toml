[project]
name = "farmalux-ecommerce"
version = "3.0.0"
description = "E-Commerce Platform with FastAPI Backend and React Frontend"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "you@example.com"}
]
keywords = ["ecommerce", "fastapi", "react", "pydantic", "alembic"]

dependencies = [
    # Core Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    
    # Database
    "aiosqlite>=0.19.0",
    "alembic>=1.13.0",
    "sqlalchemy>=2.0.0",  # Requerido por Alembic
    
    # Validation & Config
    "pydantic[email]>=2.5.0",
    "python-dotenv>=1.0.0",
    
    # Utilities
    "pillow>=10.1.0",
    "qrcode[pil]>=7.4.2",
    "psutil>=5.9.8",
    
    # Auth & Security
    "PyJWT>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    
    # Async HTTP & Email
    "httpx>=0.26.0",
    "aiosmtplib>=3.0.0",
    "watchdog>=3.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
    "httpx>=0.26.0",  # Para testing de FastAPI
]

postgres = [
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
]

[project.scripts]
start = "scripts.run:start"
stop = "scripts.run:stop"
setup = "scripts.run:setup"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

# ===== RUFF (Linter) =====
[tool.ruff]
target-version = "py311"
line-length = 120
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
]

[tool.ruff.isort]
known-first-party = ["backend"]

# ===== MYPY (Type Checking) =====
[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "aiosqlite.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "qrcode.*"
ignore_missing_imports = true

# ===== PYTEST =====
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"
